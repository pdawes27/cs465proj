<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in | FinWeb</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styleguide.css') }}">
</head>
<body>
    <header class="heading">
        <div class="finwebtitle"><h1>FinWeb</h1></div>
        <a class="nav-link" href="{{ url_for('home') }}">Home</a>
    </header>
    <main class="page-shell form-wrap">
        <section class="form-card">
            <p class="eyebrow">Welcome back</p>
            <h2>Log in to your account</h2>
            <p>Pick up right where you left off.</p>
            {% if error %}
                <p class="login-error" role="alert">{{ error }}</p>
            {% endif %}
            <form action="/login-attempt" method="post">
                <label class="form-field">
                    <span>Username or email</span>
                    <input type="text" name="username" value="{{ entered_username or '' }}" autocomplete="username" required>
                </label>
                <label class="form-field">
                    <span>Password</span>
                    <input type="password" name="password" autocomplete="current-password" required>
                </label>
                <button class="button" type="submit">Log in</button>
            </form>
            <p class="form-footer">Need an account? <a href="{{ url_for('signuppage') }}">Sign up</a></p>
        </section>
    </main>
</body>
</html>
